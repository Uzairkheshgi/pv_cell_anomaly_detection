# Ablation: run 2's configuration with class weighting off.
#
# Every PVEL-S run so far used median-frequency weighting -- not by config, but
# because train.py called it unconditionally until 25d4fce. Ramadan et al.
# report that plain CE beat weighted CE on this dataset (S8.5), and our whole
# 1.9-point defect-IoU gap to them is precision, which is the direction
# up-weighting defects moves. S10.6 found the same effect on Benchmark EL.
#
# Everything below matches results2/pvels_predefined/config.yaml exactly except
# name and class_weights, so this is a one-variable change against a run we
# already have. Note epochs 120, not the 50 in pvels.yaml -- that file does not
# describe the reference run.
#
# Expect a small move: median(freq)/freq on two classes at 15.9/84.1 is about
# 3.14 vs 0.59, a 5.3:1 spread, nowhere near the 7735:1 of the 29-class runs
# and nowhere near the clip.
name: pvels_nowt
root: data/pv_kaggle/PVEL_S
image_dir: defect
mask_dir: label
image_glob: "*.jpg"
mask_suffix: _mask

split_mode: predefined
tile: 512
stride: 256

class_weights: false

epochs: 120
batch_size: 8
encoder: resnet34
