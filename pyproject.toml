[project]
name = "pv-cell-anomaly-detection"
version = "0.1.0"
description = "Supervised defect segmentation on electroluminescence images of PV cells"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "segmentation-models-pytorch>=0.4",
    "albumentations>=2.0",
    "numpy>=2.0",
    "opencv-python-headless>=4.10",
    "scikit-learn>=1.5",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "pandas>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

# torch comes from one of two groups. cpu is the default, so `uv sync` on a
# machine without a GPU does the right thing; `--no-group cpu --group gpu` on a
# GPU box pulls the CUDA build instead.
[dependency-groups]
cpu = ["torch>=2.6", "torchvision>=0.21"]
gpu = ["torch>=2.6", "torchvision>=0.21"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pv_anomaly"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
default-groups = ["cpu"]
conflicts = [[{ group = "cpu" }, { group = "gpu" }]]

# `explicit = true` means an index is used ONLY for the packages mapped to it
# below. Without it, uv would search the PyTorch index for everything.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", group = "cpu" },
    { index = "pytorch-cuda", group = "gpu" },
]
torchvision = [
    { index = "pytorch-cpu", group = "cpu" },
    { index = "pytorch-cuda", group = "gpu" },
]
