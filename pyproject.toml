[project]
name = "pv-cell-anomaly-detection"
version = "0.1.0"
description = "Supervised defect segmentation on electroluminescence images of PV cells"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "torch>=2.6",
    "torchvision>=0.21",
    "segmentation-models-pytorch>=0.4",
    "albumentations>=2.0",
    "numpy>=2.0",
    "opencv-python-headless>=4.10",
    "scikit-learn>=1.5",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "pandas>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pv_anomaly"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# CPU-only PyTorch. `explicit = true` means this index is consulted ONLY for
# the packages mapped to it below -- everything else still resolves from PyPI.
# Without it, uv would search the PyTorch index for every dependency.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]
